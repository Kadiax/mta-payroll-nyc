# workflow-definition.yaml — sequential orchestration of the 4 MTA payroll
# Cloud Run Jobs, in the exact order the old Makefile ran them (`make all`):
# create-datasets -> extract -> load -> transform.
#
# Deliberately does NOT branch on execution-result fields (e.g.
# succeededCount) — some are omitted by the connector's JSON response on
# success (proto3 default-value omission), which throws a spurious
# KeyError even when the underlying Job execution genuinely succeeded.
# Trust the connector's built-in error propagation instead: a failed Job
# execution fails the Workflow step on its own, no manual switch/raise
# needed.

main:
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - region: "europe-west9"
    - runCreateDatasets:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + region + "/jobs/mta-create-datasets"}
        result: createDatasetsExecution
    - runExtract:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + region + "/jobs/mta-extract"}
        result: extractExecution
    - runLoad:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + region + "/jobs/mta-load"}
        result: loadExecution
    - runTransform:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + region + "/jobs/mta-transform"}
        result: transformExecution
    - allDone:
        return: "MTA payroll pipeline completed successfully"
